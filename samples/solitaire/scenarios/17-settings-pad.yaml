name: settings-pad
description: "A controller alone changes settings on the page: Draw 3 by arrow, the checkbox off, Music volume up by two (the readout follows)."
steps:
  - screen: settings
  - step: 3
  - nav: dpad_right      # in the focused radio group the arrow moves the choice to Draw 3
  - nav: down            # a radio group is one tab stop: next is the checkbox
  - nav: south
  - nav: down
  - nav: dpad_right
  - nav: dpad_right
  - step: 3
  - expect:
      capture: { reference: refs/settings-pad-720p.png, size: 1280x720, tolerance: 2, max-diff: 0.001 }

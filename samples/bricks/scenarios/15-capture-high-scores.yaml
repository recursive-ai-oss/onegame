name: capture-high-scores
description: The table after two games were saved, at 1280x720 and at 1920x1080 with a UI scale of 1.5.
steps:
  - fixture: last-life
  - screen: play
  - step: 80
  - click: name
  - type: Ada
  - click: save-score
  - fixture: last-life
  - step: 80
  - click: name
  - type: Grace
  - click: save-score
  - screen: scores
  - step: 3
  - expect:
      capture: { reference: refs/scores-720p.png, size: 1280x720, tolerance: 2, max-diff: 0.001 }
  - expect:
      capture: { reference: refs/scores-1080p.png, size: 1920x1080, scale: 1.5, tolerance: 2, max-diff: 0.001 }

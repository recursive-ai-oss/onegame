name: pause
description: The Pause button (or the controller's Start) freezes the ball behind a dialog; Resume carries on from the same spot.
steps:
  - click: play
  - step: 2
  - press: Space
  - step: 20
  - click: pause-button
  - step: 2
  - expect: { state: { entity: Court, property: Paused, equals: true } }
  - expect: { ui: { id: pause, visible: true } }
  - expect: { state: { entity: Court, property: "Balls[0].Y", equals: 497.123592378 } }
  - step: 30
  - expect: { state: { entity: Court, property: "Balls[0].Y", equals: 497.123592378 } }
  - nav: start
  - step: 2
  - expect: { state: { entity: Court, property: Paused, equals: false } }
  - expect: { ui: { id: pause, visible: false } }
  - step: 10
  - expect: { state: { entity: Court, property: "Balls[0].Y", equals: 443.197747804 } }

name: swap-needs-the-colour
description: A swap for a colour the other player does not hold is refused and changes nothing.
fixture: traders
steps:
  - command: { entity: Player, name: SwapLocal, args: [2, 0, 2] }
  - step: 1
expect:
  - state: { entity: Player#1, property: Red, equals: 2 }
  - state: { entity: Player#2, property: Blue, equals: 2 }
  - state: { entity: Player#2, property: Gold, equals: 0 }

# The same cluster with graphics devices on the bots, so a capture from a bot shows the 3D view drawn from what its replicas hold.
# Build both programs into bin/ first (see README.md).
name: lanterns-3d
startupTimeout: 60000
nodes:
  - name: master
    role: server
    exe: bin/LanternsServer
    listen: udp
    scopes: [{ id: 3, seed: 3 }]
    args: [--option, "peers={port:master.peer}", --option, "peer.1=udp://127.0.0.1:{port:islandA.peer}", --option, "peer.key.1={key:islandA}", --option, "peer.2=udp://127.0.0.1:{port:islandB.peer}", --option, "peer.key.2={key:islandB}", --option, "data={dir}/data"]
  - name: islandA
    role: server
    exe: bin/LanternsServer
    listen: udp+ws
    scopes: [{ id: 1, seed: 1 }]
    args: [--option, "peers={port:islandA.peer}", --option, "peer.2=udp://127.0.0.1:{port:islandB.peer}", --option, "peer.key.2={key:islandB}", --option, "peer.3=udp://127.0.0.1:{port:master.peer}", --option, "peer.key.3={key:master}", --option, "data={dir}/data"]
  - name: islandB
    role: server
    exe: bin/LanternsServer
    listen: udp+ws
    scopes: [{ id: 2, seed: 2 }]
    args: [--option, "peers={port:islandB.peer}", --option, "peer.1=udp://127.0.0.1:{port:islandA.peer}", --option, "peer.key.1={key:islandA}", --option, "peer.3=udp://127.0.0.1:{port:master.peer}", --option, "peer.key.3={key:master}", --option, "data={dir}/data"]
  # A bot's name starts with "bot": the game plays itself. This one is over a slow, lossy link.
  - name: bot1
    role: client
    exe: bin/Lanterns
    connect: islandA
    transport: udp
    scope: 1
    args: [--also-scopes, "2,3", --gpu, auto]
    net: "latency=100,loss=0.02,seed=5"
  # This one is over a WebSocket.
  - name: bot2
    role: client
    exe: bin/Lanterns
    connect: islandB
    transport: ws
    scope: 2
    args: [--also-scopes, "1,3", --gpu, auto]

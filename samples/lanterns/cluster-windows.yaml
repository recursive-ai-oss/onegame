# The same cluster with bot1 running on a Windows machine over ssh: the servers and bot2 run on this computer, and the
# other machine reaches them by this computer's network address (see cluster/ssh-client-windows.sh). Build both programs into bin/ first (README.md).
name: lanterns-windows
startupTimeout: 60000
nodes:
  - name: master
    role: server
    exe: bin/LanternsServer
    listen: udp
    scopes: [{ id: 3, seed: 3 }]
    args: [--option, "peers={port:master.peer}", --option, "peer.1=udp://127.0.0.1:{port:islandA.peer}", --option, "peer.key.1={key:islandA}", --option, "peer.2=udp://127.0.0.1:{port:islandB.peer}", --option, "peer.key.2={key:islandB}", --option, "data={dir}/data"]
  - name: islandA
    role: server
    exe: bin/LanternsServer
    listen: udp+ws
    scopes: [{ id: 1, seed: 1 }]
    args: [--option, "peers={port:islandA.peer}", --option, "peer.2=udp://127.0.0.1:{port:islandB.peer}", --option, "peer.key.2={key:islandB}", --option, "peer.3=udp://127.0.0.1:{port:master.peer}", --option, "peer.key.3={key:master}", --option, "data={dir}/data"]
  - name: islandB
    role: server
    exe: bin/LanternsServer
    listen: udp+ws
    scopes: [{ id: 2, seed: 2 }]
    args: [--option, "peers={port:islandB.peer}", --option, "peer.1=udp://127.0.0.1:{port:islandA.peer}", --option, "peer.key.1={key:islandA}", --option, "peer.3=udp://127.0.0.1:{port:master.peer}", --option, "peer.key.3={key:master}", --option, "data={dir}/data"]
  # The client plays until its replica reaches a tick and prints its result, like an exported release build. It is over a slow,
# lossy link (the conditioner runs inside the app); without latency the bot dithers around its target instead of reaching it.
  - name: bot1
    role: client
    exe: cluster/ssh-client-windows.sh
    release: true
    connect: islandA
    transport: udp
    scope: 1
    args: [--also-scopes, "2,3", --until-tick, "3600"]
    net: "latency=100,loss=0.02,seed=5"
  # This one is a desktop client over a WebSocket.
  - name: bot2
    role: client
    exe: bin/Lanterns
    connect: islandB
    transport: ws
    scope: 2
    args: [--also-scopes, "1,3"]

name: overlay
description: The development overlay (F3) draws what the physics world holds on top of the game - every shape's outline (grey static, green awake, dim asleep, blue for the character, teal for the trigger) and the contact points - and does not touch the state hash.
window: 320x180
steps:
  - step: 20
  - action: { name: move, state: down, x: 1, y: 0 }
  - step: 29
  - action: { name: move, state: up }
  - step: 5
  - action: jump
  - step: 22
  - action: { name: move, state: down, x: 1, y: 0 }
  - step: 30
  - action: { name: move, state: up }
  - overlay: on
  - step: 1
expect:
  - capture: { reference: refs/overlay.png, tolerance: 48, max-diff: 0.01 }

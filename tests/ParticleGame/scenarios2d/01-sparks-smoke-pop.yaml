name: seeded 2D emitters show a spark fountain, smoke and a pop, and the harness counts them
window: 480x270
steps:
  - step: 1
  # Both steady emitters were pre-warmed on their first frame, so they are already full; the pop has not happened.
  - expect: {particles: {emitter: sparks, min: 55, max: 90}}
  - expect: {particles: {emitter: smoke, min: 25, max: 50}}
  - expect: {particles: {emitter: pop, count: 0}}
  - expect: {capture: {reference: refs/stream.png, tolerance: 4, max-diff: 0.001}}
  - command: {entity: Spout, name: Pop}
  - step: 1
  - expect: {particles: {emitter: pop, count: 24}}
  - expect: {capture: {reference: refs/pop-born.png, tolerance: 4, max-diff: 0.001}}
  - step: 20
  - expect: {particles: {emitter: pop, count: 24}}
  - expect: {capture: {reference: refs/pop-spread.png, tolerance: 4, max-diff: 0.001}}
  - step: 60
  - expect: {particles: {emitter: pop, count: 0}}
  - expect: {particles: {min: 60}}
expect:
  - tick: 82

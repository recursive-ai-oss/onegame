name: ci

# Builds and tests on Linux and Windows for every push to main and every pull request. A push to a ci-check/* branch
# runs the same checks on a commit that is not on main yet, and so does a manual dispatch.
on:
  push:
    branches: [main, 'ci-check/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: windows-latest, rid: win-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # Software Vulkan (lavapipe) is deterministic and needs no GPU; the validation layer reports misuse.
      ONEGAME_GPU_VALIDATION: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build output goes outside the checkout
        run: |
          echo "ONEGAME_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"

      # The setup action's bundled installer still downloads from a feed that no longer allows public access;
      # the current install script from dot.net uses builds.dotnet.microsoft.com.
      - name: Install .NET
        run: |
          dir="$RUNNER_TEMP/dotnet"
          if [ "$RUNNER_OS" = Windows ]; then
            curl -fsSL --retry 3 https://dot.net/v1/dotnet-install.ps1 -o "$RUNNER_TEMP/dotnet-install.ps1"
            pwsh -NoProfile -File "$RUNNER_TEMP/dotnet-install.ps1" -JsonFile global.json -InstallDir "$dir"
          else
            curl -fsSL --retry 3 https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
            bash "$RUNNER_TEMP/dotnet-install.sh" --jsonfile global.json --install-dir "$dir"
          fi
          echo "DOTNET_ROOT=$dir" >> "$GITHUB_ENV"
          echo "$dir" >> "$GITHUB_PATH"

      # The distro's Mesa gives a CPU Vulkan device (lavapipe); xvfb and weston give the X11 and Wayland tests a display
      # server; clang and zlib are what NativeAOT links with on Linux.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev mesa-vulkan-drivers libvulkan1 \
            xvfb xauth weston libxkbcommon0 libasound2t64
          icd=$(find /usr/share/vulkan/icd.d -name "lvp_icd*.json" | head -1)
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "lavapipe: $icd"
          # The distro's validation layer is older than the one the tests were written against and reports synchronization
          # hazards in swapchain presentation that newer releases do not. Use a pinned newer build, checked by SHA-256.
          deb=vulkan-validationlayers_1.4.341.0-1_amd64.deb
          curl -fsSL -o "$RUNNER_TEMP/$deb" "http://archive.ubuntu.com/ubuntu/pool/universe/v/vulkan-validationlayers/$deb"
          echo "2c17a34dd97c72ce819f4c8684fa5fea5a8ef1c689d6a8700f40fcf49d898df3  $RUNNER_TEMP/$deb" | sha256sum -c -
          dpkg-deb -x "$RUNNER_TEMP/$deb" "$RUNNER_TEMP/vvl"
          echo "VK_ADD_LAYER_PATH=$RUNNER_TEMP/vvl/usr/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/vvl/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"

      # A hosted Windows machine has no GPU driver, so no Vulkan loader and no device: add the loader and a CPU driver.
      - name: Windows Vulkan loader and lavapipe
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/ci/windows-vulkan.ps1

      # Debug is the configuration with the development tools (live control, scenarios) that the tests and clusters use.
      - name: Build (warnings are errors)
        run: dotnet build OneGame.slnx

      - name: Test
        run: bash tools/ci/run-tests.sh Debug

      - name: Release build (warnings are errors)
        if: ${{ !cancelled() }}
        run: dotnet build OneGame.slnx -c Release

      - name: Publish AOT smoke app (warnings are errors)
        if: ${{ !cancelled() }}
        run: dotnet publish tests/OneGame.AotSmoke -c Release -r ${{ matrix.rid }} -o "$RUNNER_TEMP/smoke" -warnaserror
      - name: Run AOT smoke app
        if: ${{ !cancelled() }}
        env:
          ONEGAME_GPU_ADAPTER: software
        run: '"$RUNNER_TEMP/smoke/OneGame.AotSmoke"'

      - name: Publish the onegame command (warnings are errors)
        if: ${{ !cancelled() }}
        run: dotnet publish src/OneGame.Cli -c Release -r ${{ matrix.rid }} -o "$RUNNER_TEMP/cli" -warnaserror
      - name: Run the onegame command
        if: ${{ !cancelled() }}
        run: '"$RUNNER_TEMP/cli/onegame" --version --json'

      - name: Solitaire scenarios
        if: ${{ !cancelled() }}
        env:
          ONEGAME_GPU_ADAPTER: software
        run: bash tools/ci/scenarios.sh "$RUNNER_TEMP/cli/onegame" samples/solitaire "$OUT/hashes" --no-unit

      - name: Lanterns scenarios
        if: ${{ !cancelled() }}
        env:
          ONEGAME_GPU_ADAPTER: software
        run: bash tools/ci/scenarios.sh "$RUNNER_TEMP/cli/onegame" samples/lanterns "$OUT/hashes" --no-unit

      - name: Lanterns process cluster
        if: ${{ !cancelled() }}
        env:
          ONEGAME_GPU_ADAPTER: software
        run: bash tools/ci/lanterns-cluster.sh "$RUNNER_TEMP/cli/onegame" "$OUT/cluster"

      # The examples gallery: every example's scenarios, and the networked one on a cluster of three processes.
      - name: Examples
        if: ${{ !cancelled() }}
        env:
          ONEGAME_GPU_ADAPTER: software
        run: bash tools/ci/examples.sh "$RUNNER_TEMP/cli/onegame" "$OUT/examples"

      # The shipped program: NativeAOT, no development tools, started headless; its world hash is compared across systems below.
      - name: Export solitaire and run it
        if: ${{ !cancelled() }}
        run: bash tools/ci/export-run.sh "$RUNNER_TEMP/cli/onegame" ${{ matrix.rid }} "$OUT/hashes"

      - name: Export with the Steam library
        if: ${{ !cancelled() }}
        run: bash tools/ci/steam-pack.sh "$RUNNER_TEMP/cli/onegame" ${{ matrix.rid }} "$OUT/steam"

      - name: Keep the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/artifacts/test-logs
            ${{ runner.temp }}/out/cluster
            ${{ runner.temp }}/out/examples
            ${{ runner.temp }}/out/hashes/*.json
            ${{ runner.temp }}/out/hashes/*.txt
          if-no-files-found: warn

  # A game built from packages alone: pack the engine into a local folder, install the onegame tool from it, then new, run, test
  # and export without an engine checkout. The folder stands in for nuget.org; the one* siblings come from the real one.
  packages:
    name: packages ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux }
          - { os: windows-latest, target: win }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build output goes outside the checkout
        run: echo "ONEGAME_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"

      - name: Install .NET
        run: |
          dir="$RUNNER_TEMP/dotnet"
          if [ "$RUNNER_OS" = Windows ]; then
            curl -fsSL --retry 3 https://dot.net/v1/dotnet-install.ps1 -o "$RUNNER_TEMP/dotnet-install.ps1"
            pwsh -NoProfile -File "$RUNNER_TEMP/dotnet-install.ps1" -JsonFile global.json -InstallDir "$dir"
          else
            curl -fsSL --retry 3 https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
            bash "$RUNNER_TEMP/dotnet-install.sh" --jsonfile global.json --install-dir "$dir"
          fi
          echo "DOTNET_ROOT=$dir" >> "$GITHUB_ENV"
          echo "$dir" >> "$GITHUB_PATH"

      # NativeAOT links with clang and zlib on Linux.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: Pack, install the tool, create, run, test and export a game
        run: bash tools/ci/package-smoke.sh ${{ matrix.target }} "$RUNNER_TEMP/package-smoke"

  # The same scenarios and the same exported game must end in the same world hash on every system.
  same-hashes:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: logs-*
          path: logs
      - name: Compare
        run: bash tools/ci/compare-hashes.sh logs/logs-ubuntu-latest logs/logs-windows-latest

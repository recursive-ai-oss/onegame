name: ci-check

# Runs only on deliberate checks: a push to a ci-check/* branch, or a manual dispatch.
on:
  push:
    branches: ['ci-check/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: windows-latest, rid: win-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Build output goes outside the checkout; the runner context is only available inside steps.
      - name: Artifacts directory
        shell: bash
        run: echo "ONEGAME_ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build OneGame.slnx -c Release
      - name: Test
        run: dotnet test --solution OneGame.slnx -c Release --no-build
      - name: Native AOT toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - name: Publish AOT smoke app (warnings are errors)
        run: dotnet publish tests/OneGame.AotSmoke -c Release -r ${{ matrix.rid }} -o ${{ runner.temp }}/smoke -warnaserror
      - name: Run AOT smoke app
        shell: bash
        run: '"$RUNNER_TEMP/smoke/OneGame.AotSmoke"'
      - name: Publish the onegame command (warnings are errors)
        run: dotnet publish src/OneGame.Cli -c Release -r ${{ matrix.rid }} -o ${{ runner.temp }}/cli -warnaserror
      - name: Run the onegame command
        shell: bash
        run: '"$RUNNER_TEMP/cli/onegame" --version --json'
